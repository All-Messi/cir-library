baseURL = 'https://christir.org/'
languageCode = 'en-us'
title = 'Christian Internet Resources'
theme = 'scholarly'
googleAnalytics = 'G-65KM86FCYC'

[params]
  author = "Virgil Warren, PhD"
  description = "The theological library of Virgil Warren, PhD: essays, Bible translations, books and communion meditations, written with interpersonalism (IP) in mind."
  siteName = "CIR"
  fullName = "Christian Internet Resources"
  mainSections = ["essays", "translations"]
  # SEO (2026-11-04): canonical/OG/JSON-LD always point here, even on the staging mirror
  canonicalBase = "https://christir.org"
  ogImage = "images/og-default.png"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Essays"
    url = "/essays/"
    weight = 2
  [[menu.main]]
    name = "Text"
    url = "/translations/"
    weight = 3
  [[menu.main]]
    name = "Glossary"
    identifier = "glossary"
    url = "/essays/language/glossary-of-communication-related-terms/"
    weight = 4
  [[menu.main]]
    name = "Author"
    url = "/author/"
    weight = 5
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 6

# tags/topics were never used (empty /tags/ and /topics/ pages in the sitemap): dropped 2026-11-04
[taxonomies]
  category = "categories"

[outputs]
  home = ["HTML", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
